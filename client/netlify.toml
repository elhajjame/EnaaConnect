[build]
  # Install the API's dependencies (../server) so the Netlify Server can bundle them,
  # then build the React app.
  command = "npm ci --prefix ../server --omit=dev && npm run build"
  publish = "dist"

# SPA fallback for React Router pages. /api/* and /socket.io/* are intentionally
# not listed: they are handled by the Netlify Server (netlify/server/index.mjs).
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
