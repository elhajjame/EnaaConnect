services:
  mongo:
    image: mongo:8
    container_name: enaaconnect-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: enaaconnect-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      PORT: "3000"
      CONNECT_DB: "mongodb://mongo:27017/enaaConnect"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
